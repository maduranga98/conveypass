name: CI

# Pull requests, and reused by deploy.yml so a release is verified the same way before it ships.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore and Storage emulators need a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install (also installs functions/ through the postinstall hook)
        run: npm ci

      - name: Lint (ESLint incl. jsx-a11y)
        run: npm run lint

      - name: Type check (tsc --noEmit for the web app, the service worker, scripts and functions)
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:unit

      - name: Function tests (Firestore emulator)
        run: npm run test:functions

      - name: Rules tests (Firestore and Storage emulators)
        run: npm run test:rules

      - name: "Build the web app (no secrets needed: public config is injected at deploy time)"
        run: npm run build

      - name: "Bundle budget (gzipped first load of the driver and security routes; heavy libraries must stay lazy)"
        run: npm run bundle:report -- --budget

      - name: Build the functions
        run: npm --prefix functions run build
